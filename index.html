<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Sito</title><meta name="description" content=""><link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="data.js"></script>
<style>
/* LAYOUT "pop": colori pieni, bordi spessi, ombre piene. Pizzerie di quartiere giovani, napoletane contemporanee, street food con sala. */
:root{--primary:#c8283a;--primary-2:#1c1c1c;--accent:#ffb627;--accent-2:#ffe3a3;--soft:#fff3e0;--cream:#fff8ec;--paper:#fffdf8;--ink:#1c1c1c;--muted:#55504a;--line:#1c1c1c;--max:1200px;--sh:5px 5px 0 var(--ink)}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:.98;letter-spacing:-.02em}
.eyebrow{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:.35em .8em;border-radius:999px}
.btn{padding:.9em 1.4em;border-radius:14px;border:2.5px solid var(--ink);box-shadow:var(--sh);font-size:1rem}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn-primary{background:var(--accent);color:var(--ink)}.btn-secondary{background:#fff;color:var(--ink)}
header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2.5px solid var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;height:70px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.45rem;font-weight:800}
nav{display:flex;gap:1.3rem;align-items:center;font-weight:700}
nav a{text-decoration:none}nav a:not(.btn):hover{color:var(--primary)}
nav .btn{padding:.5em .9em;box-shadow:3px 3px 0 var(--ink)}
@media (max-width:860px){nav a:not(.btn){display:none}}
.hero{background:var(--primary);color:#fff;border-bottom:2.5px solid var(--ink);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(48px,7vw,90px)}
.hero .eyebrow{background:var(--accent);color:var(--ink)}
.hero h1{font-size:clamp(3rem,8.5vw,6.8rem);margin:.25em 0 .3em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent);display:block}
.hero p{font-size:1.15rem;max-width:40ch;opacity:.95}
.cta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.8rem}
.pic{position:relative}
.pic img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--ink);transform:rotate(2.5deg)}
.sticker{position:absolute;left:-18px;top:-18px;width:120px;height:120px;border-radius:50%;background:var(--accent);color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1;transform:rotate(-12deg);animation:spin 16s linear infinite}
.sticker b{font-size:2rem;display:block}.sticker small{font-size:.62rem;font-weight:700;display:block;max-width:80px;margin-top:.2rem}
@keyframes spin{from{transform:rotate(-12deg)}to{transform:rotate(348deg)}}
@media (prefers-reduced-motion:reduce){.sticker{animation:none}}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.pic{max-width:440px;margin:10px auto 0}.sticker{left:0}}
.marquee{background:var(--accent);border-bottom:2.5px solid var(--ink);overflow:hidden;white-space:nowrap;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem;text-transform:uppercase}
.marquee div{display:inline-flex;gap:2rem;padding:.7rem 0;animation:mq 22s linear infinite}
.marquee span{display:inline-flex;align-items:center;gap:2rem}.marquee span::after{content:"✺"}.marquee i{display:none}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee div{animation:none}}
section{padding:clamp(60px,9vw,110px) 0}
.head{margin-bottom:2.4rem;max-width:720px}
.head h2{font-size:clamp(2.3rem,5.5vw,4rem);margin:.3em 0 .3em;text-transform:uppercase}
.head p{color:var(--muted);font-size:1.1rem}
.pillars{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:18px}
.p-item{background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:1.6rem;box-shadow:var(--sh)}
.p-item:nth-child(4n+1){background:var(--accent-2)}.p-item:nth-child(4n+3){background:var(--soft)}
.p-n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.4rem;color:var(--primary)}
.p-item h3{font-size:1.35rem;margin:.3rem 0 .5rem}.p-item p{color:var(--muted)}
@media (max-width:900px){.pillars{grid-template-columns:1fr 1fr}}@media (max-width:520px){.pillars{grid-template-columns:1fr}}
.story{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,70px);align-items:center}
.story img{width:100%;aspect-ratio:4/5;object-fit:cover;border:3px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--primary)}
.story h2{font-size:clamp(2.2rem,4.5vw,3.4rem);margin:.3em 0 .5em;text-transform:uppercase}
.story p{margin-bottom:1em;font-size:1.05rem}
.story ul{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
.story li{border:2px solid var(--ink);border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.9rem;background:#fff}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.g-item{border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.g-item img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .4s}.g-item:hover img{transform:scale(1.06)}
.g-1{grid-column:span 2;grid-row:span 2}.g-1 img{aspect-ratio:auto;height:100%}
@media (max-width:700px){.gallery{grid-template-columns:1fr 1fr}.g-1{grid-column:span 2;grid-row:auto}.g-1 img{aspect-ratio:4/3}}
#menu{background:var(--cream);border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.menu-bar{position:sticky;top:70px;z-index:10;background:var(--cream);padding:.8rem 0;margin-bottom:2rem;border-bottom:2.5px solid var(--ink)}
.menu-tabs button{font-weight:700;padding:.45em 1em;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink)}
.menu-tabs button[aria-selected=true]{background:var(--primary);color:#fff}
.menu-pick{font-weight:700;padding:.65em 1em;border:2.5px solid var(--ink);border-radius:12px;background:var(--accent)}
.menu-search{border-radius:12px}.menu-search input{border:2.5px solid var(--ink);background:#fff}
.m-cat{margin-bottom:3rem}
.m-cat-h{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.m-cat-h h3{font-size:2.2rem;text-transform:uppercase}.m-cat-h small{font-weight:700;color:var(--muted)}
.m-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.m-item{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:1rem 1.1rem;position:relative}
.m-row{flex-direction:column;align-items:flex-start;gap:.2rem}
.m-name{font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem;font-weight:800;padding-right:4.5rem}
.m-dots{display:none}
.m-price{position:absolute;top:.8rem;right:.8rem;background:var(--accent);border:2px solid var(--ink);border-radius:10px;padding:.15em .5em;font-size:.9rem}
.m-tag{background:var(--primary);color:#fff}
.notes{display:grid;gap:.4rem;font-size:.9rem;color:var(--muted);margin-top:1rem}.notes a{color:var(--primary);font-weight:700}
.info{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:18px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:1.5rem;box-shadow:var(--sh)}
.card h3{font-size:1.6rem;margin:.5rem 0 .8rem;text-transform:uppercase}
.card:nth-child(2){background:var(--accent-2)}
table.hours td{border-color:rgba(0,0,0,.15)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.actions .btn{padding:.6em 1em;font-size:.88rem;box-shadow:3px 3px 0 var(--ink)}
.map{border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--sh);min-height:360px}
@media (max-width:960px){.info{grid-template-columns:1fr 1fr}.map{grid-column:1/-1}}@media (max-width:600px){.info{grid-template-columns:1fr}}
footer{background:var(--ink);color:#fff;padding:50px 0}
.foot{display:flex;justify-content:space-between;gap:2rem;flex-wrap:wrap;align-items:flex-end}
.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2.4rem,8vw,5.5rem);line-height:.9;text-transform:uppercase;color:var(--accent)}
footer p{opacity:.8}.social a{background:var(--accent);color:var(--ink)}.social{margin-top:1rem}
.legal{margin-top:1.6rem;font-size:.8rem;opacity:.55}
.callbar .btn-secondary{background:#fff}
</style>
</head>
<body>
<header data-sticky><div class="wrap top">
  <a class="brand" href="#top"><img data-s="logo" alt=""><b data-s="shortName"></b></a>
  <nav data-s="nav"></nav>
</div></header>
<section class="hero" id="top" style="padding:0"><div class="wrap">
  <div class="reveal"><span class="eyebrow" data-s="hero-eyebrow"></span><h1 data-s="hero-title"></h1><p data-s="hero-lead"></p><div class="cta" data-s="hero-cta"></div></div>
  <div class="pic reveal"><img data-s="hero-img" fetchpriority="high"><div class="sticker" data-section="rating"><div><b data-s="rating-value"></b><small>su Google</small></div></div></div>
</div></section>
<div class="marquee" aria-hidden="true"><div><span data-s="hero-badges" data-rating="no" style="display:inline-flex;gap:2rem"></span><span data-s="hero-badges" data-rating="no" style="display:inline-flex;gap:2rem"></span></div></div>
<section data-section="pillars"><div class="wrap"><div class="pillars reveal" data-s="pillars"></div></div></section>
<section id="storia" data-section="story" style="padding-top:0"><div class="wrap story">
  <img class="reveal" data-s="story-img" loading="lazy">
  <div class="reveal"><span class="eyebrow" data-s="story-eyebrow"></span><h2 data-s="story-title"></h2><div data-s="story-body"></div><ul data-s="story-bullets"></ul></div>
</div></section>
<section id="galleria" data-section="gallery" style="padding-top:0"><div class="wrap">
  <div class="head reveal"><span class="eyebrow" data-s="gallery-eyebrow"></span><h2 data-s="gallery-title"></h2><p data-s="gallery-lead"></p></div>
  <div class="gallery reveal" data-s="gallery" data-max="5"></div>
</div></section>
<section id="menu" data-section="menu">
  <div class="wrap"><div class="head reveal"><span class="eyebrow" data-s="menu-eyebrow"></span><h2 data-s="menu-title"></h2><p data-s="menu-lead"></p></div></div>
  <div class="menu-bar" data-sticky><div class="wrap menu-ctl"><div class="menu-tabs" role="tablist" data-s="menu-tabs"></div><select class="menu-pick" data-s="menu-pick" aria-label="Categoria"></select><label class="menu-search" data-s="menu-search"></label></div></div>
  <div class="wrap"><div data-s="menu-list" data-style="cards"></div><p data-s="menu-empty">Nessun piatto trovato.</p><div class="notes" data-s="menu-notes"></div></div>
</section>
<section id="dove"><div class="wrap">
  <div class="head reveal"><span class="eyebrow">Passa a trovarci</span><h2 data-s="addressShort"></h2><p data-s="addressLead"></p></div>
  <div class="info">
    <div class="card reveal" data-section="hours"><span class="status" data-s="status"></span><h3>Orari</h3><table class="hours" data-s="hours"></table><p data-s="hours-note"></p></div>
    <div class="card reveal"><h3>Contatti</h3><p data-s="contacts"></p><div class="actions" data-s="contact-actions"></div></div>
    <div class="map reveal"><iframe data-s="map"></iframe></div>
  </div>
</div></section>
<footer><div class="wrap">
  <div class="foot"><div class="big" data-s="shortName"></div><div><p data-s="footer-contacts"></p><div class="social" data-s="social"></div></div></div>
  <p class="legal" data-s="legal"></p>
</div></footer>
<div class="callbar" data-s="callbar"></div>
<script src="core.js"></script>
</body>
</html>
